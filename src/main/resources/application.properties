# ===================================================================
# Hotel Management System - Spring Boot Application Configuration
# Academic DevOps Project: Automated CI/CD Pipeline
# ===================================================================

# --- Application Info ---
spring.application.name=hotel-management-system
server.port=${SERVER_PORT:8080}

# --- Database Configuration (MySQL) ---
# Environment variables allow zero-code changes between Local, Docker, and CI environments.
# Format: ${ENV_VAR_NAME:default_fallback_value}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP Connection Pool Settings ---
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# --- JPA / Hibernate Settings ---
# 'update' automatically updates database schema based on JPA entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Spring Boot Actuator (Health Checks & Monitoring) ---
# Exposes /actuator/health and /actuator/info for CI/CD automated deployment verification
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Actuator metadata info exposed via /actuator/info
info.app.name=Hotel Management System
info.app.description=Automated CI/CD Pipeline Academic DevOps Project
info.app.version=1.0.0
info.app.environment=${APP_ENV:production}
