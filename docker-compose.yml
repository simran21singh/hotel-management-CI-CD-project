# ===================================================================
# Docker Compose Multi-Container Orchestration
# Grand Horizon Hotel Management System - Academic DevOps Project
# ===================================================================

services:
  # -----------------------------------------------------------------
  # 1. Database Service: MySQL 8.0
  # -----------------------------------------------------------------
  hotel-db:
    image: mysql:8.0
    container_name: hotel-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-hotel_db}
      MYSQL_USER: ${DB_USER:-hoteluser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hotelpass}
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      # Persistent named volume for database data
      - mysql_data:/var/lib/mysql
      # Auto-executed seed script on initial container creation
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD:-rootpassword} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - hotel-network

  # -----------------------------------------------------------------
  # 2. Application Service: Spring Boot & Embedded Frontend
  # -----------------------------------------------------------------
  hotel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: hotel-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hotel_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      APP_ENV: ${APP_ENV:-docker}
      SHOW_SQL: "false"
    depends_on:
      hotel-db:
        condition: service_healthy
    networks:
      - hotel-network

# -------------------------------------------------------------------
# Dedicated Bridge Network for Inter-Container Communication
# -------------------------------------------------------------------
networks:
  hotel-network:
    name: hotel-network
    driver: bridge

# -------------------------------------------------------------------
# Persistent Storage Volumes
# -------------------------------------------------------------------
volumes:
  mysql_data:
    name: hotel_mysql_data
    driver: local
